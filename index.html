<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إلى شهد ❤️</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }

body {
  height: 100vh;
  overflow: hidden;
  background: #ffe0e6; /* وردي */
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: rgba(255,255,255,0.25);
  padding: 40px;
  border-radius: 25px;
  width: 380px;
  text-align: center;
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.2);
}

#text {
  font-size: 26px;
  line-height: 2;
  margin-bottom: 30px;
  white-space: pre-line;
  color: #e63946;
}

button {
  padding: 12px 25px;
  font-size: 20px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  margin: 0 20px; /* زيادة المسافة بين الأزرار */
  transition: transform 0.3s ease; /* حركة سلسة */
}

#yes { background: #fff; color: #e63946; }
#no { background: #00000070; color: #fff; }

#video-container {
  width: 250px;
  margin: 0 auto 20px;
  border-radius: 15px;
  overflow: hidden;
}

#video-container video {
  width: 100%;
  display: block;
  border-radius: 15px;
}

/* القلوب */
.heart {
  position: fixed;
  top: -20px;
  color: #ff4d6d;
  font-size: 28px;
  animation: fall linear forwards;
  z-index: 1;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div id="video-container">
    <video autoplay muted loop>
      <source src="bg.mp4" type="video/mp4">
    </video>
  </div>

  <div id="text">تحبيني لو لا؟ 💔</div>
  <div>
    <button id="yes">نعم 😳</button>
    <button id="no">لا 🙄</button>
  </div>
</div>

<audio id="voice" src="voice.mp3"></audio>

<script>
let step = 0;
const text = document.getElementById("text");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const voice = document.getElementById("voice");

/* الشعر + توقيت كل سطر */
const poemTimeline = [
  { time: 0, line: "شَهْدُ…" },
  { time: 3, line: "يا فائضَ الحُسنِ الذي" },
  { time: 7, line: "أربكَ المعاني" },
  { time: 10, line: "وأتعبَ البلاغةَ" },
  { time: 14, line: "حين حاولتُ أن أصفكِ" },
  { time: 18, line: "" },
  { time: 20, line: "أنا لا أقول أحبكِ" },
  { time: 24, line: "لأن الحبَّ" },
  { time: 27, line: "كلمةٌ قصيرة" },
  { time: 31, line: "لا تسعُ هذا الخراب الجميل" },
  { time: 36, line: "الذي صنعتِه في قلبي" },
  { time: 42, line: "" },
  { time: 44, line: "أنتِ بدايةُ الرجفة" },
  { time: 48, line: "ونهايتُها" },
  { time: 51, line: "أنتِ السؤالُ" },
  { time: 55, line: "حين تعجزُ الإجابة" },
  { time: 59, line: "والصمتُ" },
  { time: 62, line: "حين يخونُ الكلام" },
  { time: 67, line: "" },
  { time: 69, line: "أحبكِ حُبًّا" },
  { time: 73, line: "لو أُلقيَ على الجبالِ" },
  { time: 78, line: "لانحنت" },
  { time: 83, line: "" },
  { time: 85, line: "شهدُ…" },
  { time: 88, line: "أنا رجلٌ" },
  { time: 91, line: "كلما ناداكِ" },
  { time: 95, line: "نسيَ اسمه" },
  { time: 100, line: "" },
  { time: 102, line: "أعشقكِ" },
  { time: 105, line: "عشقَ من لا يطلبُ نجاة" },
  { time: 110, line: "ولا يفاوضُ على قلبه" },
  { time: 116, line: "" },
  { time: 118, line: "إن قالوا لي: ما الوطن؟" },
  { time: 123, line: "قلتُ: شهد" },
  { time: 128, line: "" },
  { time: 130, line: "وإن غبتِ" },
  { time: 134, line: "اختلَّ اتجاهُ الزمن" },
  { time: 139, line: "وإن حضرتِ" },
  { time: 143, line: "صار الكونُ" },
  { time: 147, line: "أصغر من كفّيكِ 🤍" }
];

/* حركة زر لا */
no.addEventListener("mouseover", () => {
  const x = Math.random() * 30 - 15; // حركة لطيفة
  const y = Math.random() * 10 - 5;
  no.style.transform = `translate(${x}px, ${y}px)`;
});

yes.addEventListener("click", () => {
  step++;
  if (step === 1) text.innerText = "متأكدة؟ 😌";
  else if (step === 2) text.innerText = "صدك تحبيني؟";
  else if (step === 3) text.innerText = "زين… تعشقيني؟ ❤️";
  else {
    yes.style.display = "none";
    no.style.display = "none";
    text.innerText = "";
    voice.play();
    startHearts();
    playPoemWithAudio();
  }
});

function playPoemWithAudio() {
  poemTimeline.forEach(item => {
    setTimeout(() => {
      text.innerText += item.line + "\n";
    }, item.time * 1000);
  });
}

function startHearts() {
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 300);
}
</script>
</body>
</html>
